<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc">
  <title id="title">Comparing low-rank language model compression</title>
  <desc id="desc">Conceptual overview: replace a full weight matrix with low-rank factors, then evaluate quality, memory use and latency under shared settings. No measured results are shown.</desc>
  <defs>
    <pattern id="matrix" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="18" height="18" rx="2" fill="#9b789d"/></pattern>
    <pattern id="factor" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="18" height="18" rx="2" fill="#5d8885"/></pattern>
  </defs>
  <rect width="600" height="330" fill="#fbfaf8"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#293331">
    <text x="143" y="43" font-size="25">Model weights</text>
    <text x="422" y="43" font-size="25">Low-rank factors</text>
    <rect x="83" y="66" width="120" height="120" fill="url(#matrix)"/>
    <g stroke="#756575" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M242 126h59m-9-9 9 9-9 9"/></g>
    <rect x="342" y="66" width="40" height="120" fill="url(#factor)"/>
    <text x="408" y="135" font-size="30" fill="#7b807b">×</text>
    <rect x="438" y="106" width="120" height="40" fill="url(#factor)"/>
    <path d="M42 218h516" stroke="#dfdfd8"/>
    <text x="300" y="251" font-size="23" fill="#615365">Shared evaluation</text>
    <g font-size="24" fill="#293331"><text x="112" y="293">Quality</text><text x="300" y="293">Memory</text><text x="488" y="293">Latency</text></g>
    <g fill="#b4a6b4"><circle cx="204" cy="285" r="3"/><circle cx="394" cy="285" r="3"/></g>
  </g>
</svg>
